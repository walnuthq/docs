name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    # The README doesn't change the site, so it doesn't redeploy.
    paths-ignore:
      - "README.md"
  workflow_dispatch:

# Never run two deploys at once; queue rather than cancel so an in-flight
# deploy is not interrupted.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Deploy to Cloudflare Workers
        # `pnpm deploy` is a pnpm built-in; `pnpm run deploy` runs the script.
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
