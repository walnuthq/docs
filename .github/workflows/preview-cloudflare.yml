name: Preview on Cloudflare Workers

# Uploads each pull request as a new version of the walnut-docs Worker, under
# the preview alias `pr-<number>`, and comments its URL on the PR:
# https://pr-<number>-walnut-docs.walnuthq.workers.dev
#
# Uploading a version does not deploy it: docs.walnut.dev keeps serving the
# version deploy-cloudflare.yml deployed from `main`. Each push moves the alias
# to the new version, so the URL stays the same for the life of the PR.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Same as the deploy: the README doesn't change the site.
    paths-ignore:
      - "README.md"

permissions:
  contents: read
  pull-requests: write

# A new push replaces a preview still being built for the same PR.
concurrency:
  group: preview-cloudflare-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Pull requests from forks get no secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      ALIAS: pr-${{ github.event.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Upload a preview version
        run: pnpm run upload -- --preview-alias "$ALIAS"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check the preview responds
        run: |
          set -euo pipefail
          url="https://$ALIAS-walnut-docs.walnuthq.workers.dev"
          # The alias can take a few seconds to point at the new version.
          for _ in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null "$url"; then
              echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          echo "$url did not respond" >&2
          exit 1

      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          marker="<!-- preview-cloudflare -->"
          body="$marker
          **Preview:** $PREVIEW_URL

          Built from $SHA."
          # Edit the comment from an earlier run rather than adding another.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body"
          fi
